<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舞台走位校验系统</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎭</span>
      <div>
        <h1>舞台走位校验系统</h1>
        <p class="subtitle">区域连接图 · 通道封闭时段 · 到位口令时间校验</p>
      </div>
    </div>
    <div class="actions">
      <button id="btn-refresh" class="btn">🔄 重新校验</button>
      <a id="btn-export" class="btn btn-accent" href="/api/report" download>📄 导出校验报告</a>
      <button id="btn-reset" class="btn btn-ghost">↩️ 恢复示例数据</button>
    </div>
  </header>

  <main>
    <!-- 校验结果 -->
    <section class="card" id="validation-card">
      <div class="card-head">
        <h2>校验结果</h2>
        <div class="mode-switch" id="mode-switch" role="tablist">
          <button type="button" class="mode-btn" data-mode="propagate">⛓ 连续口令延误传导</button>
          <button type="button" class="mode-btn" data-mode="classic">📐 区段独立校验</button>
        </div>
      </div>
      <p class="mode-hint" id="mode-hint"></p>
      <div id="summary" class="summary"></div>
      <div id="validation-results"></div>
    </section>

    <!-- 数据管理 -->
    <div class="panels">
      <section class="card" id="panel-areas">
        <h2>舞台区域</h2>
        <form id="form-area" class="entity-form">
          <input type="hidden" id="area-id" />
          <input type="text" id="area-name" placeholder="区域名称，如：舞台中央" required maxlength="30" />
          <input type="text" id="area-desc" placeholder="备注（可选）" maxlength="60" />
          <div class="form-buttons">
            <button type="submit" class="btn btn-accent" id="area-submit">添加区域</button>
            <button type="button" class="btn btn-ghost hidden" id="area-cancel">取消编辑</button>
          </div>
        </form>
        <table>
          <thead><tr><th>名称</th><th>备注</th><th class="col-ops">操作</th></tr></thead>
          <tbody id="areas-tbody"></tbody>
        </table>
      </section>

      <section class="card" id="panel-edges">
        <h2>区域连接（通行耗时 · 封闭时段）</h2>
        <form id="form-edge" class="entity-form">
          <input type="hidden" id="edge-id" />
          <select id="edge-a" required></select>
          <select id="edge-b" required></select>
          <input type="number" id="edge-seconds" placeholder="耗时(秒)" min="0" step="1" required />
          <div class="closures-editor" id="closures-editor">
            <div class="closures-head">
              <span>🚧 通道封闭时段（秒，可添加多段）</span>
              <button type="button" class="btn btn-small" id="btn-add-closure">＋ 添加时段</button>
            </div>
            <div id="closures-list"></div>
            <p class="closures-hint">封闭规则：开始 ≤ t &lt; 结束 内通道不可通行；校验时将在前一区域等待或自动绕行。</p>
          </div>
          <div class="form-buttons">
            <button type="submit" class="btn btn-accent" id="edge-submit">添加连接</button>
            <button type="button" class="btn btn-ghost hidden" id="edge-cancel">取消编辑</button>
          </div>
        </form>
        <table>
          <thead><tr><th>区域 A</th><th>区域 B</th><th>通行耗时</th><th>封闭时段</th><th class="col-ops">操作</th></tr></thead>
          <tbody id="edges-tbody"></tbody>
        </table>
      </section>

      <section class="card" id="panel-actors">
        <h2>演员</h2>
        <form id="form-actor" class="entity-form">
          <input type="hidden" id="actor-id" />
          <input type="text" id="actor-name" placeholder="演员姓名，如：张三" required maxlength="30" />
          <input type="text" id="actor-role" placeholder="角色（可选），如：饰 王子" maxlength="30" />
          <div class="form-buttons">
            <button type="submit" class="btn btn-accent" id="actor-submit">添加演员</button>
            <button type="button" class="btn btn-ghost hidden" id="actor-cancel">取消编辑</button>
          </div>
        </form>
        <table>
          <thead><tr><th>姓名</th><th>角色</th><th class="col-ops">操作</th></tr></thead>
          <tbody id="actors-tbody"></tbody>
        </table>
      </section>

      <section class="card" id="panel-cues">
        <h2>到位口令</h2>
        <form id="form-cue" class="entity-form">
          <input type="hidden" id="cue-id" />
          <select id="cue-actor" required></select>
          <select id="cue-area" required></select>
          <input type="text" id="cue-time" placeholder="时间，如 90 或 01:30" required />
          <input type="number" id="cue-dwell" placeholder="停留(秒) 0~600" min="0" max="600" step="1" title="在该区域需停留的秒数（0～600），用于连续口令延误传导模式" />
          <input type="text" id="cue-note" placeholder="口令说明（可选）" maxlength="60" />
          <div class="form-buttons">
            <button type="submit" class="btn btn-accent" id="cue-submit">添加口令</button>
            <button type="button" class="btn btn-ghost hidden" id="cue-cancel">取消编辑</button>
          </div>
        </form>
        <table>
          <thead><tr><th>演员</th><th>时间</th><th>目标区域</th><th>停留</th><th>说明</th><th class="col-ops">操作</th></tr></thead>
          <tbody id="cues-tbody"></tbody>
        </table>
      </section>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
